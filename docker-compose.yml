version: '3.9'

services:
  ubuntu_vm1:
    image: ubuntu:latest
    container_name: Machine_1
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    networks:
      internal_net:
        aliases:
          - vm1
        ipv4_address: 192.216.1.2
    volumes:
      - type: bind
        source: ./
        target: /data

  ubuntu_vm2:
    image: ubuntu:latest
    container_name: Machine_2
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    networks:
      internal_net:
        aliases:
          - vm2
        ipv4_address: 192.216.1.3
        
    volumes:
      - type: bind
        source: ./
        target: /data

networks:
  internal_net:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 192.216.1.0/24
        - gateway: 192.216.1.0