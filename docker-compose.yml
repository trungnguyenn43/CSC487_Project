version: '3.9'

services:
  ubuntu_vm1:
    image: ubuntu:latest
    container_name: Machine_1
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    networks:
      internal_net:
        aliases:
          - vm1
        ipv4_address: 10.0.0.2
      bridge:
        aliases:
          - vm1-bridge
    volumes:
      - type: bind
        source: ./
        target: /data

  ubuntu_vm2:
    image: ubuntu:latest
    container_name: Machine_2
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    networks:
      internal_net:
        aliases:
          - vm2
        ipv4_address: 10.0.0.3
      bridge:
        aliases:
          - vm2-bridge
    volumes:
      - type: bind
        source: ./
        target: /data

networks:
  internal_net:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1

  bridge:
    driver: bridge
    internal: false
    